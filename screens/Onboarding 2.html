<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-start overflow-hidden">

<header class="w-full flex justify-end items-center px-margin-mobile py-lg">

<div class="w-full max-w-[320px] aspect-square flex items-center justify-center">

<span class="material-symbols-outlined text-[300px] text-primary" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>

<div class="relative z-10 w-full h-full flex flex-col items-center justify-center">

<div class="mt-lg flex items-center gap-base bg-secondary-container text-on-secondary-container px-lg py-base rounded-full shadow-sm">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
<span class="font-label-bold text-label-sm">ಕನ್ನಡ ಆಡಿಯೋ ಲಭ್ಯವಿದೆ</span>
</div>
</div>
</div>
</main>
<!-- Bottom Content Card -->
<section class="bg-surface-container-lowest w-full h-[45%] rounded-t-[24px] shadow-2xl flex flex-col items-center px-margin-mobile pt-lg pb-xl z-20">
<!-- Pagination Dots -->
<div class="flex gap-xs mb-lg">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Text Content -->
<div class="text-center space-y-sm mb-lg">
<h1 class="text-on-surface font-headline-lg-mobile text-[22px] leading-tight">
                Speaks in Your Language
            </h1>
<p class="text-on-surface-variant font-body-md text-[13px] max-w-[280px] mx-auto leading-relaxed">
                Get diagnosis and treatment advice in English, Kannada, or Hindi — spoken aloud so every farmer can understand.
            </p>
</div>
<!-- Language Pill Badges -->
<div class="flex flex-wrap justify-center gap-sm mb-xl">
<div class="border border-primary text-primary px-lg py-xs rounded-full font-label-bold text-label-sm flex items-center justify-center min-w-[64px]">

                हिं
            </div>
</div>

<div class="w-full mt-auto">
<button class="w-full bg-primary-container text-on-primary font-title-md text-title-md py-md rounded-xl flex items-center justify-center gap-base active:scale-[0.98] transition-transform">

</button>
</div>

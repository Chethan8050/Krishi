<p class="font-label-bold text-on-surface mb-xs">Take or Upload Photo</p>
<p class="font-label-sm text-on-surface-variant">PNG, JPG or JPEG up to 10MB</p>
</div>

<div class="flex gap-md">
<button class="flex-1 flex items-center justify-center gap-xs border border-primary text-primary font-label-bold py-md px-lg rounded-full hover:bg-primary-container/10 transition-colors">

                </button>
<button class="flex-1 flex items-center justify-center gap-xs border border-primary text-primary font-label-bold py-md px-lg rounded-full hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined" data-icon="image">image</span>

                </button>
</div>

<div class="flex-grow border-t border-outline-variant"></div>

<div class="flex-grow border-t border-outline-variant"></div>
</div>

<span class="bg-secondary-container text-on-secondary-container px-lg py-xs rounded-full font-label-sm whitespace-nowrap">Soybean</span>
</div>

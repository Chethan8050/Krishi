</div>

</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-xl">
<!-- Large Circular Progress Indicator -->
<div class="relative flex items-center justify-center mb-xl">
<!-- Background Ring -->
<svg class="w-48 h-48 md:w-64 md:h-64">
<circle class="text-surface-container-highest" cx="96" cy="96" fill="transparent" r="80" stroke="currentColor" stroke-width="8"></circle>

<circle class="text-primary-container" cx="96" cy="96" fill="transparent" r="80" stroke="currentColor" stroke-dasharray="502.65" stroke-dashoffset="175.92" stroke-linecap="round" stroke-width="8" style="transform: rotate(-90deg); transform-origin: 50% 50%;"></circle>
</svg>
<!-- Center Icon -->
<div class="absolute flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-[48px] md:text-[64px]" data-icon="leaf" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
</div>
<!-- Headline & Subtext -->
<div class="text-center space-y-xs mb-xl">
<h2 class="font-label-bold text-headline-lg-mobile text-on-surface">AI is analysing your crop</h2>
<p class="font-body-md text-on-surface-variant">Scanning for 38 possible diseases...</p>
</div>
<!-- Step Indicators (Bento-style list) -->
<div class="w-full max-w-md space-y-md">
<!-- Step 1: Complete -->
<div class="flex items-center gap-md p-md bg-surface-variant/30 rounded-xl border border-outline-variant">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-bold text-on-surface">Image uploaded</span>
</div>
<!-- Step 2: Complete -->
<div class="flex items-center gap-md p-md bg-surface-variant/30 rounded-xl border border-outline-variant">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-bold text-on-surface">Preprocessing image</span>
</div>
<!-- Step 3: Active -->
<div class="flex items-center gap-md p-md bg-secondary-container rounded-xl border border-secondary">
<span class="material-symbols-outlined text-secondary animate-spin" data-icon="sync">sync</span>
<span class="font-label-bold text-on-secondary-container">Running detection</span>
</div>
<!-- Step 4: Pending -->
<div class="flex items-center gap-md p-md bg-surface rounded-xl border border-outline-variant opacity-50">
<span class="material-symbols-outlined text-outline" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-body-md text-on-surface-variant">Generating treatment</span>
</div>

<style>
        body { font-family: 'Public Sans', sans-serif; }

        }
        .mic-pulse {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #A5D6A7;
            opacity: 0.5;
        }
        .pulse-1 { transform: scale(1.2); }
        .pulse-2 { transform: scale(1.4); opacity: 0.3; }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top Bar: Task-Focused Custom Navigation -->
<header class="sticky top-0 w-full z-50 flex justify-between items-center px-margin-mobile py-base bg-primary text-on-primary">
<div class="flex items-center gap-base">
<button class="p-2 active:opacity-70 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md font-bold">Voice Diagnosis</h1>
</div>
<div class="flex gap-xs">
<span class="bg-surface-container-lowest text-primary px-3 py-1 rounded-full text-label-sm font-label-bold">EN</span>
<span class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full text-label-sm font-label-bold">KN</span>
<span class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full text-label-sm font-label-bold">HI</span>
</div>
</header>
<main class="flex-1 px-margin-mobile py-xl flex flex-col items-center">
<!-- Voice Interaction Section -->
<div class="relative flex items-center justify-center w-full aspect-square max-w-[280px] mb-lg">
<!-- Pulsing Circles -->
<div class="mic-pulse pulse-1"></div>
<div class="mic-pulse pulse-2"></div>
<!-- Main Mic Button -->
<button class="relative z-10 w-[140px] h-[140px] rounded-full bg-primary flex items-center justify-center shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[48px] text-white" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<div class="text-center mb-xl">
<p class="text-primary font-label-bold text-body-md mb-xs">Listening...</p>
<p class="text-on-surface-variant italic text-label-sm">Speak your crop problem in Kannada or Hindi</p>
</div>
<!-- Live Transcript Box -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md min-h-[100px] mb-xl flex flex-col gap-xs">
<span class="text-label-sm font-label-bold text-on-surface-variant">You said:</span>
<p class="text-on-surface font-title-md">ನನ್ನ ಟೊಮ್ಯಾಟೊ ಎಲೆ ಹಳದಿಯಾಗುತ್ತಿದೆ</p>
<p class="text-on-surface-variant italic text-body-md">"My tomato leaves are turning yellow"</p>
</div>
<!-- Language Instruction Row -->
<div class="grid grid-cols-3 gap-base w-full mb-xl">
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-base flex flex-col items-center justify-center text-center">
<span class="text-lg mb-1">🇬🇧</span>
<span class="text-label-sm font-label-bold text-on-surface">Say in English</span>
</div>
<div class="bg-surface-container-lowest border-2 border-primary rounded-lg p-base flex flex-col items-center justify-center text-center">
<span class="text-lg mb-1">🇮🇳</span>
<span class="text-label-sm font-label-bold text-primary">ಕನ್ನಡದಲ್ಲಿ ಹೇಳಿ</span>
</div>
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-base flex flex-col items-center justify-center text-center">
<span class="text-lg mb-1">🇮🇳</span>
<span class="text-label-sm font-label-bold text-on-surface">हिंदी में बोलें</span>
</div>
</div>
<!-- Spacer for push to bottom buttons -->
<div class="flex-1"></div>
<!-- Action Buttons -->
<div class="w-full space-y-md mt-auto">
<button class="w-full bg-primary text-on-primary py-md rounded-full font-label-bold text-body-lg active:scale-[0.98] transition-all">
                Analyse What I Said
            </button>
<button class="w-full border-2 border-outline-variant text-on-surface-variant py-md rounded-full font-label-bold text-body-lg active:bg-surface-container transition-colors">
                Type Instead
            </button>
</div>
</main>

<style>
        /* Custom Keyframes for Voice Pulse Effect */
        @keyframes voice-ripple {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
                border-width: 2px;
            }
            100% {
                transform: scale(3.5);
                opacity: 0;
                border-width: 0px;
            }
        }
        .animate-voice-ripple {
            animation: voice-ripple 2.5s cubic-bezier(0.1, 0.7, 0.3, 1) infinite;
        }
        .delay-1 { animation-delay: 0.8s; }
        .delay-2 { animation-delay: 1.6s; }
        
        /* Glass gradient highlight */
        .glass-gradient-border {
            background: linear-gradient(to bottom right, rgba(255,255,255,0.1), transparent);
            padding: 1px;
            border-radius: inherit;
        }
    </style>

<!DOCTYPE html><html class="dark" lang="en"><head>

<style>
        .glass-panel {
            background: rgba(43, 45, 48, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: relative;
        }
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .glow-effect {
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop antialiased font-body-md">
<!-- Transactional Screen: Top Nav and Bottom Nav suppressed -->
<main class="w-full max-w-lg mx-auto flex flex-col gap-gutter items-center">
<!-- Success Animation/Icon -->
<div class="relative flex items-center justify-center w-24 h-24 mb-4 rounded-full bg-primary/10 glow-effect border border-primary/20">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">
                check_circle
            </span>
<div class="absolute inset-0 rounded-full border border-primary/30 animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
</div>
<!-- Headline -->
<div class="text-center mb-section-gap">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Order Confirmed</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your order has been successfully placed.</p>
</div>
<!-- Order Summary Card -->
<div class="w-full glass-panel rounded-xl p-card-padding flex flex-col gap-4">
<div class="flex justify-between items-start border-b border-glass-stroke pb-4">
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Order ID</p>
<p class="font-headline-md text-headline-md text-on-surface">FD0891</p>
</div>
<div class="flex items-center gap-1.5 bg-primary/10 border border-primary/20 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-md text-label-md text-primary">UPI Success</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4 py-2">
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase mb-1">Product</p>
<p class="font-body-md text-body-md text-on-surface font-medium">Organic Roma Tomatoes</p>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase mb-1">Quantity</p>
<p class="font-body-md text-body-md text-on-surface font-medium">10kg</p>
</div>
</div>
<div class="border-t border-glass-stroke pt-4 flex justify-between items-center">
<p class="font-body-lg text-body-lg text-on-surface-variant">Total Price</p>
<p class="font-headline-md text-headline-md text-primary">₹400</p>
</div>
</div>
<!-- Pickup Details Card -->
<div class="w-full glass-panel rounded-xl p-card-padding flex items-start gap-4 mt-2">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-glass-stroke">
<span class="material-symbols-outlined text-tertiary">store</span>
</div>
<div>
<h3 class="font-body-md text-body-md font-medium text-on-surface mb-1">Pickup Details</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-1">Tomorrow, 06:00 AM</p>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">location_on</span>
                    KrishiDrishti Hub, Sector 4
                </p>
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-section-gap py-4 px-6 rounded-full bg-surface-container border border-glass-stroke text-on-surface font-body-lg text-body-lg font-medium hover:bg-primary hover:text-on-primary hover:border-primary transition-all duration-300 flex justify-center items-center gap-2 group">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
            Back to Dashboard
        </button>
</main>
</body></html>

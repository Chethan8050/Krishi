<style>
        /* Technical Grid Background overlay */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-surface-dim text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased p-margin-mobile md:p-margin-desktop">
<!-- Ambient background glows -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] opacity-10 pointer-events-none" style="background: radial-gradient(circle, #4edea3 0%, transparent 70%);"></div>
<div class="absolute inset-0 bg-grid-pattern pointer-events-none z-0"></div>
<!-- Main Content Canvas (Transactional Screen -> No Nav Shell) -->
<main class="relative z-10 w-full max-w-md w-full">
<!-- Glassmorphic Card Container -->
<div class="bg-surface-container/70 backdrop-blur-2xl border border-glass-stroke rounded-xl shadow-2xl shadow-black/50 p-[32px] flex flex-col gap-8 relative overflow-hidden">
<!-- Subtle top specular highlight -->
<div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20 shadow-[0_0_30px_rgba(78,222,163,0.1)]">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">translate</span>
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Select Language</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Initialize your field operations interface.</p>
</div>
</div>
<!-- Language Selection List -->
<div class="flex flex-col gap-3" id="language-list">
<!-- Option: English (Default Active) -->
<button class="lang-option w-full flex items-center justify-between p-4 rounded-lg transition-all duration-300 border border-primary bg-primary/10 shadow-[0_0_15px_rgba(78,222,163,0.15)] group" data-lang="en" type="button">
<div class="flex flex-col items-start">
<span class="font-body-lg text-body-lg text-primary font-medium tracking-wide">English</span>
<span class="font-body-sm text-body-sm text-primary/70">English</span>
</div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option: Hindi -->
<button class="lang-option w-full flex items-center justify-between p-4 rounded-lg transition-all duration-300 border border-glass-stroke bg-surface-container-low hover:bg-surface hover:border-outline-variant group" data-lang="hi" type="button">
<div class="flex flex-col items-start">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-white transition-colors">Hindi</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">हिन्दी</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">radio_button_unchecked</span>
</button>
<!-- Option: Kannada -->
<button class="lang-option w-full flex items-center justify-between p-4 rounded-lg transition-all duration-300 border border-glass-stroke bg-surface-container-low hover:bg-surface hover:border-outline-variant group" data-lang="kn" type="button">
<div class="flex flex-col items-start">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-white transition-colors">Kannada</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">ಕನ್ನಡ</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">radio_button_unchecked</span>
</button>
</div>
<!-- Action Area -->
<div class="pt-4">
<!-- Pill button with Neutral background, thin stroke, transitions to primary on hover -->
<button class="w-full h-14 rounded-full bg-surface-container border border-glass-stroke flex items-center justify-center gap-2 group hover:bg-primary transition-all duration-300 shadow-lg relative overflow-hidden" type="button">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-on-primary font-medium z-10 transition-colors">Continue</span>
<span class="material-symbols-outlined text-on-surface group-hover:text-on-primary group-hover:translate-x-1 transition-all z-10">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        // Micro-interaction logic for language selection
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.lang-option');
            
            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Reset all options to inactive state
                    options.forEach(opt => {
                        opt.className = 'lang-option w-full flex items-center justify-between p-4 rounded-lg transition-all duration-300 border border-glass-stroke bg-surface-container-low hover:bg-surface hover:border-outline-variant group';
                        
                        // Reset text colors
                        const mainText = opt.querySelector('.font-body-lg');
                        const subText = opt.querySelector('.font-body-sm');
                        mainText.className = 'font-body-lg text-body-lg text-on-surface group-hover:text-white transition-colors';
                        subText.className = 'font-body-sm text-body-sm text-on-surface-variant';
                        
                        // Reset icon
                        const icon = opt.querySelector('.material-symbols-outlined');
                        icon.textContent = 'radio_button_unchecked';
                        icon.className = 'material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors';
                        icon.style.fontVariationSettings = "'FILL' 0";
                    });

                    // Set clicked option to active state (Emerald Industrial style)
                    this.className = 'lang-option w-full flex items-center justify-between p-4 rounded-lg transition-all duration-300 border border-primary bg-primary/10 shadow-[0_0_15px_rgba(78,222,163,0.15)] group';
                    
                    const mainText = this.querySelector('.font-body-lg');
                    const subText = this.querySelector('.font-body-sm');
                    mainText.className = 'font-body-lg text-body-lg text-primary font-medium tracking-wide';
                    subText.className = 'font-body-sm text-body-sm text-primary/70';
                    
                    const icon = this.querySelector('.material-symbols-outlined');
                    icon.textContent = 'check_circle';
                    icon.className = 'material-symbols-outlined text-primary';
                    icon.style.fontVariationSettings = "'FILL' 1";
                });
            });
        });
    </script>
</body></html>
